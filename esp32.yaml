# ESP32 firmware for volture: the yoziru/esphome-tesla-ble firmware, pulled from GitHub
# and pinned to a release tag, plus the few settings this project needs.
#
#   uv run esphome run esp32.yaml --device /dev/cu.usbserial-0001   # first flash, over USB
#   uv run esphome run esp32.yaml --device volture.local          # later updates, over Wi-Fi
#
# Secrets come from ./secrets.yaml (gitignored, template: secrets.example.yaml).

substitutions:
  # The volture: block of secrets.yaml (settings of the control loop), e.g. ${volture_settings.poll_s}.
  volture_settings: !secret volture
  # Firmware release. Each release states the minimum ESPHome version; keep pyproject.toml in sync.
  tesla_ble_ref: v2026.10.1
  ble_mac_address: !secret ble_mac_address
  tesla_vin: !secret tesla_vin
  # Grafana Cloud push (README: Grafana). Empty grafana_url: nothing is ever sent.
  grafana_url: !secret grafana_url
  grafana_user: !secret grafana_user
  grafana_token: !secret grafana_token
  # First-boot values of two settings editable on the page (kept across reboots afterwards):
  # local hour (0-23) of the daily reboot, only while the car is unplugged (-1 = never), and the free
  # memory % below which a Grafana push is skipped (0 = never skip).
  scheduled_reboot_hour: !secret scheduled_reboot_hour
  grafana_skip_below_free_pct: !secret grafana_skip_below_free_pct
  # true: the Shelly's clamp is on the main feed and measures the car too. false: the Shelly is on the
  # house circuit only; the car's draw is added to it (esp32/device.h, reading_of). Crucial for the limit.
  shelly_includes_tesla: !secret shelly_includes_tesla

packages:
  yoziru.esphome-tesla-ble:
    url: https://github.com/yoziru/esphome-tesla-ble.git
    ref: ${tesla_ble_ref}
    # Classic ESP32 (Elegoo board, chip ESP32-D0WD-V3, 4 MB flash).
    files: [tesla-ble-esp32-generic.dashboard.yml]

esphome:
  name: volture
  friendly_name: volture
  includes: # Volture's control loop, see the end of this file
    - esp32/controller.h
    - esp32/device.h
  on_boot:
    # Before any page or API client connects: hide every car control and non-charging reading, and put
    # the car's charging readings in a "Tesla" section (esp32/device.h, arrange_page, says why).
    priority: 800
    then:
      - lambda: |-
          volture_device::arrange_page(id(web_ui));
          // secrets.yaml's volture: block -> this device's settings (before the loop's first use).
          auto &cfg = volture_device::config();
          cfg.contracted_power_w = ${volture_settings.contracted_power_w};
          cfg.headroom_w = ${volture_settings.headroom_w};
          cfg.fallback_voltage_v = ${volture_settings.fallback_voltage_v};
          cfg.min_amps = ${volture_settings.min_amps};
          cfg.max_amps = ${volture_settings.max_amps};
          cfg.ramp_up_step_amps = ${volture_settings.ramp_up_step_amps};
          cfg.ramp_up_every_s = ${volture_settings.ramp_up_every_s};
          cfg.resume_after_s = ${volture_settings.resume_after_s};
          cfg.stop_after_invalid_s = ${volture_settings.stop_after_invalid_s};
          cfg.stop_without_reading = volture_device::flag("${volture_settings.stop_without_reading}");
          volture_device::loop_settings().confirm_timeout_s = ${volture_settings.confirm_timeout_s};
          volture_device::loop_settings().confirm_max_attempts = ${volture_settings.confirm_max_attempts};
          id(contracted_power).publish_state(cfg.contracted_power_w);

# A browser page left open but not read (a phone with the tab in the background) keeps its TCP
# connection alive, and lwIP holds up to TCP_SND_BUF of unsent data for it until the phone closes it.
# Each such page cost ~6 KB with the 5760 B default; a few of them plus a Grafana TLS push ran the
# heap out (abort). Two segments (2 x MSS 1440) per connection halve that; the Shelly and Grafana
# exchanges are small, so throughput does not matter.
esp32:
  framework:
    sdkconfig_options:
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "2880"

# The firmware defaults to DRIVER (unlock, open trunk...). volture only needs charging,
# so the paired key gets the least-privileged role. Changing it later requires re-pairing.
tesla_ble_vehicle:
  role: CHARGING_MANAGER

api:
  encryption:
    key: !secret api_encryption_key

# Two known networks (e.g. office and garage): the ESP32 joins whichever is in range,
# the strongest if both are.
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi2_ssid
      password: !secret wifi2_password
  ap:
    password: !secret wifi_hotspot_password

# Uncomment to find the car's BLE MAC: the log prints "Found Tesla vehicle | ... | MAC: ...".
# Put that MAC in secrets.yaml (ble_mac_address), comment this block again and reflash.
# tesla_ble_listener:
#   vin: !secret tesla_vin

# ---- Volture's control loop, running on the ESP32 itself ----
# Every second: read the Shelly, read the car's state, run one cycle of esp32/controller.h (volture::Loop),
# send what it decides. With "Volture control" off (the default) it only shows what it would do.

globals:
  - id: shelly_body # last /emeter/0 reply; empty = no reading this cycle
    type: std::string
  - id: grafana_body # the batch being pushed to Grafana
    type: std::string

# Plain HTTP to the Shelly on the LAN; HTTPS to Grafana Cloud only while "Grafana push" is on.
http_request:
  timeout: 2s # the Shelly is on the LAN: a slow reply is treated as no reading
  verify_ssl: true # the Grafana push is HTTPS: its certificate is checked...
  # ...against Grafana Cloud's root CA only (DigiCert Global Root G2, valid until 2038) instead of
  # ESP-IDF's bundle of common CAs, which costs ~1% more flash. If Grafana ever changes CA, pushes
  # fail with "error: no answer" on the page; replace this file with the new root.
  ca_certificate_path: esp32/grafana_ca.pem

# ALWAYS ON (owner's requirement): live values + JSON stream (/events) at http://volture.local.
# Never remove or make it optional.
web_server:
  id: web_ui
  port: 80
  version: 3
  ota: false # firmware updates only through `esphome run` (encrypted), never through the page
  auth:
    type: digest # the password itself never travels (basic would send it nearly in clear)
    username: !secret web_user
    password: !secret web_password
  # One section per data source, so every value says where it comes from (lower weight = higher).
  # The "Tesla" section (the car's charging readings) is added at boot by arrange_page.
  sorting_groups:
    - { id: summary, name: "Summary", sorting_weight: -50 }
    - { id: volture_live, name: "Volture status", sorting_weight: -40 }
    - { id: volture_settings, name: "Volture settings", sorting_weight: -30 }
    - { id: shelly, name: "Shelly EM", sorting_weight: -20 }
    - {
        id: volture_diagnostics,
        name: "Volture diagnostics",
        sorting_weight: -10,
      }
  js_include: esp32/web_logo.js # the Volture logo at the top of the page

debug:
  update_interval: 5s

# Network time, ONLY to timestamp the lines pushed to Grafana and for the daily reboot.
# Never used by the control logic.
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Madrid
    on_time:
      - seconds: 0
        minutes: 0
        then:
          - lambda: volture_device::reboot_if_due(id(reboot_hour).state, id(sntp_time).now().hour);

button:
  - platform: restart
    name: Reboot ESP32
    web_server: { sorting_group_id: volture_settings, sorting_weight: 6 }

switch:
  - platform: template
    id: grafana_push
    name: Grafana push
    web_server: { sorting_group_id: volture_settings, sorting_weight: 3 }
    icon: mdi:chart-line
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF # off until switched on; then kept across reboots
    on_turn_off:
      - lambda: volture_device::telemetry() = volture_device::Telemetry(); # free the buffer
  # Off (default): without a Shelly reading Volture sends nothing; the car carries on as it is.
  # On: it drops to min_amps, then stops after "Stop after no reading".
  - platform: template
    id: stop_without_shelly
    name: Stop without Shelly
    web_server: { sorting_group_id: volture_settings, sorting_weight: 2.3 }
    icon: mdi:power-plug-off-outline
    optimistic: true
    restore_mode: ${ 'RESTORE_DEFAULT_ON' if volture_settings.stop_without_reading else 'RESTORE_DEFAULT_OFF' }
  - platform: template
    id: volture_control
    name: Control
    web_server: { sorting_group_id: volture_settings, sorting_weight: 1 }
    icon: mdi:car-electric
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF # off until switched on; then kept across reboots

number:
  - platform: template
    id: poll_interval
    name: Shelly poll interval
    web_server: { sorting_group_id: volture_settings, sorting_weight: 2.1 }
    icon: mdi:timer-sync-outline
    unit_of_measurement: s
    mode: box
    min_value: 1
    max_value: 60
    step: 1
    optimistic: true
    restore_value: true # first boot: poll_s from secrets.yaml; then the page's value
    initial_value: ${volture_settings.poll_s}
  - platform: template
    id: reboot_hour
    name: Scheduled reboot hour
    web_server: { sorting_group_id: volture_settings, sorting_weight: 5 }
    icon: mdi:restart
    unit_of_measurement: h
    mode: box
    min_value: -1
    max_value: 23
    step: 1
    optimistic: true
    restore_value: true # first boot: scheduled_reboot_hour from secrets.yaml; -1 = never
    initial_value: ${scheduled_reboot_hour}
  - platform: template
    id: grafana_skip_pct
    name: Grafana skip below free memory
    web_server: { sorting_group_id: volture_settings, sorting_weight: 3.1 }
    icon: mdi:memory
    unit_of_measurement: "%"
    mode: box
    min_value: 0
    max_value: 50
    step: 1
    optimistic: true
    restore_value: true # first boot: grafana_skip_below_free_pct from secrets.yaml; 0 = never skip
    initial_value: ${grafana_skip_below_free_pct}
  - platform: template
    id: headroom
    name: Headroom
    web_server: { sorting_group_id: volture_settings, sorting_weight: 2.2 }
    icon: mdi:arrow-collapse-down
    unit_of_measurement: W
    mode: box
    min_value: 0
    max_value: 2000
    step: 10
    optimistic: true
    restore_value: true # first boot: headroom_w from secrets.yaml
    initial_value: ${volture_settings.headroom_w}
  - platform: template
    id: stop_after_invalid
    name: Stop after no reading
    web_server: { sorting_group_id: volture_settings, sorting_weight: 2.4 }
    icon: mdi:timer-off-outline
    unit_of_measurement: s
    mode: box
    min_value: 5
    max_value: 600
    step: 5
    optimistic: true
    restore_value: true # first boot: stop_after_invalid_s from secrets.yaml
    initial_value: ${volture_settings.stop_after_invalid_s}

text:
  - platform: template
    id: shelly_url
    name: Shelly EM URL
    web_server: { sorting_group_id: volture_settings, sorting_weight: 2 }
    mode: text
    optimistic: true
    restore_value: true
    initial_value: !secret shelly_url

sensor:
  # Summary: where the power the Shelly measures goes (esp32/device.h, summary).
  - platform: template
    id: contracted_power
    name: Contracted power
    web_server: { sorting_group_id: summary, sorting_weight: 1 }
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    update_interval: never # a constant: published once at boot (on_boot)
  - platform: template
    id: total_power
    name: Total power
    web_server: { sorting_group_id: summary, sorting_weight: 2 }
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: tesla_power
    name: Tesla power
    web_server: { sorting_group_id: summary, sorting_weight: 3 }
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: house_power
    name: House power
    web_server: { sorting_group_id: summary, sorting_weight: 4 }
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    update_interval: never
  # The car's charge limit (%), read-only: the car's own "Charging Limit" is a control, hidden like every
  # car control (esp32/device.h, arrange). No web_server block: its "Charg" name puts it in the Tesla section.
  - platform: template
    id: charge_limit
    name: Charge limit
    unit_of_measurement: "%"
    icon: mdi:battery-charging-100
    accuracy_decimals: 0
    update_interval: never # published by volture_cycle
  # Shelly EM: every value of its /emeter/0 reply (empty: no reading this cycle).
  - platform: template
    id: shelly_power
    name: Power
    web_server: { sorting_group_id: shelly, sorting_weight: 1 }
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: shelly_voltage
    name: Voltage
    web_server: { sorting_group_id: shelly, sorting_weight: 2 }
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: shelly_reactive
    name: Reactive power
    web_server: { sorting_group_id: shelly, sorting_weight: 3 }
    unit_of_measurement: var
    device_class: reactive_power
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: shelly_pf
    name: Power factor
    web_server: { sorting_group_id: shelly, sorting_weight: 4 }
    device_class: power_factor
    accuracy_decimals: 2
    update_interval: never
  - platform: template
    id: shelly_total
    name: Energy total
    web_server: { sorting_group_id: shelly, sorting_weight: 5 }
    unit_of_measurement: Wh
    device_class: energy
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: shelly_total_returned
    name: Energy returned
    web_server: { sorting_group_id: shelly, sorting_weight: 6 }
    unit_of_measurement: Wh
    device_class: energy
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: volture_amps
    name: Amps
    web_server: { sorting_group_id: volture_live, sorting_weight: 1 }
    unit_of_measurement: A
    device_class: current
    accuracy_decimals: 0
    update_interval: never
  # Memory as % of the whole internal heap (the debug component reports bytes of MALLOC_CAP_INTERNAL).
  - platform: debug
    free:
      name: Memory free
      web_server: { sorting_group_id: volture_diagnostics, sorting_weight: 2 }
      unit_of_measurement: "%"
      accuracy_decimals: 0
      filters:
        - lambda: return x * 100.0f / heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
    block:
      name: Memory largest block
      web_server: { sorting_group_id: volture_diagnostics, sorting_weight: 3 }
      unit_of_measurement: "%"
      accuracy_decimals: 0
      filters:
        - lambda: return x * 100.0f / heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
    min_free:
      name: Memory lowest free
      web_server: { sorting_group_id: volture_diagnostics, sorting_weight: 4 }
      unit_of_measurement: "%"
      accuracy_decimals: 0
      filters:
        - lambda: return x * 100.0f / heap_caps_get_total_size(MALLOC_CAP_INTERNAL);

binary_sensor:
  - platform: template
    id: shelly_valid
    name: Reading valid
    web_server: { sorting_group_id: shelly, sorting_weight: 7 }

text_sensor:
  - platform: uptime
    name: Uptime
    web_server: { sorting_group_id: volture_settings, sorting_weight: 4 }
  - platform: template
    name: Shelly includes Tesla
    web_server: { sorting_group_id: volture_settings, sorting_weight: 3.5 }
    icon: mdi:transmission-tower
    update_interval: 1h
    lambda: |-
      return std::string(volture_device::flag("${shelly_includes_tesla}") ? "yes (main feed)" : "no (house only)");
  - platform: template
    id: volture_decision
    name: Decision
    web_server: { sorting_group_id: volture_live, sorting_weight: 2 }
    update_interval: never
  - platform: template
    id: volture_event
    name: Event
    web_server: { sorting_group_id: volture_live, sorting_weight: 3 }
    update_interval: never
  - platform: template
    id: grafana_status
    name: Grafana push status
    web_server: { sorting_group_id: volture_diagnostics, sorting_weight: 1 }
    update_interval: never

script:
  - id: volture_cycle
    mode: single
    then:
      - lambda: |-
          std::optional<volture_device::ShellyEm> shelly;
          if (!id(shelly_body).empty()) {
            shelly = volture_device::parse_shelly(id(shelly_body));
          }
          auto observed = volture_device::observe();
          auto &loop = volture_device::loop();
          std::optional<volture::Reading> reading;  // the whole load, car included
          std::optional<volture::Reading> measured;  // what the Shelly itself measured (Grafana)
          if (shelly) {
            reading = volture_device::reading_of(*shelly, volture_device::flag("${shelly_includes_tesla}"),
                                                 volture_device::car_amps(observed, loop.ctrl));
            measured = volture_device::reading_of(*shelly, true, 0);
          }
          auto settings = volture_device::config();  // secrets.yaml, then the page's settings on top
          if (!std::isnan(id(headroom).state)) {
            settings.headroom_w = id(headroom).state;
          }
          if (!std::isnan(id(stop_after_invalid).state)) {
            settings.stop_after_invalid_s = id(stop_after_invalid).state;
          }
          settings.stop_without_reading = id(stop_without_shelly).state;
          loop.ctrl.configure(settings);
          auto cycle = loop.step(volture_device::now_s(), reading, observed, id(volture_control).state);
          std::string sent = cycle.dry_run ? "would send: " : "";
          for (const auto &cmd : {cycle.resend, cycle.command}) {
            if (!cmd) {
              continue;
            }
            sent += cmd->charging ? (std::to_string(cmd->amps) + " A ") : std::string("stop ");
            if (cycle.dry_run) {
              continue;
            }
            if (volture_device::send(*cmd)) {
              volture_device::telemetry().last_sent = *cmd;
            } else {
              ESP_LOGW("volture", "car entities not found: command not sent");
            }
          }
          const bool valid = reading && reading->valid;
          const volture_device::ShellyEm none;
          const auto &em = shelly ? *shelly : none;  // shown as replied, even when not valid; all NAN: no reply
          volture_device::publish_changed(id(shelly_power), em.power_w);
          volture_device::publish_changed(id(shelly_voltage), em.voltage_v);
          volture_device::publish_changed(id(shelly_reactive), em.reactive_var);
          volture_device::publish_changed(id(shelly_pf), em.pf);
          volture_device::publish_changed(id(shelly_total), em.total_wh);
          volture_device::publish_changed(id(shelly_total_returned), em.total_returned_wh);
          id(shelly_valid).publish_state(valid);
          const auto sum = volture_device::summary(em.power_w, em.voltage_v,
              volture_device::value_of<esphome::sensor::Sensor>(esphome::App.get_sensors(), "Charger Current"),
              volture_device::plugged(), volture_device::flag("${shelly_includes_tesla}"));
          volture_device::publish_changed(id(total_power), sum.total_w);
          volture_device::publish_changed(id(tesla_power), sum.tesla_w);
          volture_device::publish_changed(id(house_power), sum.house_w);
          volture_device::publish_changed(id(charge_limit),
              volture_device::value_of<esphome::number::Number>(esphome::App.get_numbers(), volture_device::CHARGING_LIMIT));
          id(volture_amps).publish_state(loop.ctrl.charging ? loop.ctrl.amps : 0);
          const std::string decision = std::string(loop.ctrl.reason) + (sent == "would send: " ? "" : " · " + sent);
          if (id(volture_decision).state != decision) {
            id(volture_decision).publish_state(decision);
          }
          if (id(volture_event).state != cycle.event) {
            id(volture_event).publish_state(cycle.event);
          }
          // One key=value line per cycle (InfluxDB line protocol fields), for logs and remote storage later.
          ESP_LOGI("volture", "volture power_w=%.0f,valid=%d,car_charging=%d,car_amps=%d,amps=%d,control=%d,reason=\"%s\",event=\"%s\"",
                   reading ? reading->power_w : -1.0, valid, observed ? observed->charging : -1,
                   observed ? observed->amps : -1, loop.ctrl.amps, id(volture_control).state, loop.ctrl.reason, cycle.event);
          auto clock = id(sntp_time).now();
          if (id(grafana_push).state && clock.is_valid() && !std::string("${grafana_url}").empty()) {
            using namespace esphome;
            volture_device::Sample sample;
            sample.reading = measured;
            sample.car = observed;
            sample.car_current_a = volture_device::value_of<sensor::Sensor>(App.get_sensors(), "Charger Current");
            sample.car_power_kw = volture_device::value_of<sensor::Sensor>(App.get_sensors(), "Charger Power");
            sample.amps = loop.ctrl.charging ? loop.ctrl.amps : 0;
            sample.control = id(volture_control).state;
            sample.last_sent = volture_device::telemetry().last_sent;
            sample.attempts = loop.pending ? loop.pending->attempts : 0;
            sample.reason = loop.ctrl.reason;
            sample.event = cycle.event;
            sample.answer = volture_device::text_of("Last Command");
            sample.status = volture_device::text_of("Charging");
            const long long unix_ns = static_cast<long long>(clock.timestamp) * 1000000000LL +
                                      static_cast<long long>(esp_timer_get_time() % 1000000) * 1000LL;
            volture_device::record(sample, volture_device::now_s(), heap_caps_get_free_size(MALLOC_CAP_8BIT),
                                   heap_caps_get_largest_free_block(MALLOC_CAP_8BIT),
                                   volture_device::value_of<sensor::Sensor>(App.get_sensors(), "WiFi Signal"),
                                   volture_device::value_of<sensor::Sensor>(App.get_sensors(), "BLE Signal"), unix_ns);
          }

interval:
  # Every second, the Shelly is read once Shelly poll interval (poll_s) has passed.
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return volture_device::poll_due(id(poll_interval).state);
          then:
            - http_request.get:
                url: !lambda return id(shelly_url).state + "/emeter/0";
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        id(shelly_body) = response->status_code == 200 ? body : std::string();
                    - script.execute: volture_cycle
                on_error:
                  then:
                    - lambda: id(shelly_body) = std::string();
                    - script.execute: volture_cycle
  # Grafana push: the lines buffered since the last push, once a minute, while "Grafana push" is on,
  # and only with enough free memory for HTTPS (esp32/device.h, memory_for_push).
  - interval: 60s
    then:
      - if:
          condition:
            lambda: |-
              if (!id(grafana_push).state || std::string("${grafana_url}").empty() ||
                  volture_device::telemetry().buffer.empty()) {
                return false;
              }
              if (!volture_device::memory_for_push(id(grafana_skip_pct).state)) {
                id(grafana_status).publish_state("skipped: low memory");
                ESP_LOGW("volture", "grafana push skipped: heap_free=%u heap_block=%u",
                         heap_caps_get_free_size(MALLOC_CAP_8BIT), heap_caps_get_largest_free_block(MALLOC_CAP_8BIT));
                return false;
              }
              return true;
          then:
            - lambda: |-
                id(grafana_body).swap(volture_device::telemetry().buffer);  // what is not sent now is lost
                volture_device::telemetry().buffer.clear();
            - http_request.post:
                url: !lambda return std::string("${grafana_url}");
                request_headers:
                  Content-Type: text/plain
                  Authorization: !lambda return volture_device::basic_auth("${grafana_user}", "${grafana_token}");
                body: !lambda return id(grafana_body);
                on_response:
                  then:
                    - lambda: |-
                        const bool ok = response->status_code >= 200 && response->status_code < 300;
                        id(grafana_status).publish_state((ok ? "ok " : "error ") + std::to_string(response->status_code) +
                                                         ", " + std::to_string(id(grafana_body).size()) + " B");
                        ESP_LOGI("volture", "grafana push: status=%d bytes=%u heap_free=%u heap_block=%u",
                                 response->status_code, (unsigned) id(grafana_body).size(),
                                 heap_caps_get_free_size(MALLOC_CAP_8BIT), heap_caps_get_largest_free_block(MALLOC_CAP_8BIT));
                        id(grafana_body).clear();
                on_error:
                  then:
                    - lambda: |-
                        id(grafana_status).publish_state("error: no answer");
                        ESP_LOGW("volture", "grafana push failed: heap_free=%u", heap_caps_get_free_size(MALLOC_CAP_8BIT));
                        id(grafana_body).clear();
