# ESP32 firmware for volture: the yoziru/esphome-tesla-ble firmware, pulled from GitHub
# and pinned to a release tag, plus the few settings this project needs.
#
#   uv run esphome run esp32.yaml --device /dev/cu.usbserial-0001   # first flash, over USB
#   uv run esphome run esp32.yaml --device volture.local          # later updates, over Wi-Fi
#
# Secrets come from ./secrets.yaml (gitignored, template: secrets.example.yaml).

substitutions:
  # Firmware release. Each release states the minimum ESPHome version; keep pyproject.toml in sync.
  tesla_ble_ref: v2026.10.1
  ble_mac_address: !secret ble_mac_address
  tesla_vin: !secret tesla_vin
  # Grafana Cloud push (README: Grafana). Empty grafana_url: nothing is ever sent.
  grafana_url: !secret grafana_url
  grafana_user: !secret grafana_user
  grafana_token: !secret grafana_token

packages:
  yoziru.esphome-tesla-ble:
    url: https://github.com/yoziru/esphome-tesla-ble.git
    ref: ${tesla_ble_ref}
    # Classic ESP32 (Elegoo board, chip ESP32-D0WD-V3, 4 MB flash).
    files: [tesla-ble-esp32-generic.dashboard.yml]

esphome:
  name: volture
  friendly_name: volture
  includes:  # Volture's control loop, see the end of this file
    - esp32/controller.h
    - esp32/device.h

# The firmware defaults to DRIVER (unlock, open trunk...). volture only needs charging,
# so the paired key gets the least-privileged role. Changing it later requires re-pairing.
tesla_ble_vehicle:
  role: CHARGING_MANAGER

api:
  encryption:
    key: !secret api_encryption_key

# Two known networks (e.g. office and garage): the ESP32 joins whichever is in range,
# the strongest if both are.
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi2_ssid
      password: !secret wifi2_password
  ap:
    password: !secret wifi_hotspot_password

# Uncomment to find the car's BLE MAC: the log prints "Found Tesla vehicle | ... | MAC: ...".
# Put that MAC in secrets.yaml (ble_mac_address), comment this block again and reflash.
# tesla_ble_listener:
#   vin: !secret tesla_vin

# ---- Volture's control loop, running on the ESP32 itself ----
# Every 5 s: read the Shelly, read the car's state, run one cycle of esp32/controller.h (volture::Loop),
# send what it decides. With "Volture control" off (the default) it only shows what it would do.

globals:
  - id: shelly_body  # last /emeter/0 reply; empty = no reading this cycle
    type: std::string
  - id: grafana_body  # the batch being pushed to Grafana
    type: std::string

# Plain HTTP to the Shelly on the LAN; HTTPS to Grafana Cloud only while "Grafana push" is on.
http_request:
  timeout: 2s        # the Shelly is on the LAN: a slow reply is treated as no reading
  verify_ssl: true   # the Grafana push is HTTPS: its certificate is checked...
  # ...against Grafana Cloud's root CA only (DigiCert Global Root G2, valid until 2038) instead of
  # ESP-IDF's bundle of common CAs, which costs ~1% more flash. If Grafana ever changes CA, pushes
  # fail with "error: no answer" on the page; replace this file with the new root.
  ca_certificate_path: esp32/grafana_ca.pem

# ALWAYS ON (owner's requirement): live values + JSON stream (/events) at http://volture.local.
# Never remove or make it optional.
web_server:
  port: 80
  version: 3
  ota: false     # firmware updates only through `esphome run` (encrypted), never through the page
  auth:
    type: digest  # the password itself never travels (basic would send it nearly in clear)
    username: !secret web_user
    password: !secret web_password
  # Volture's own entities in their own sections, above the Tesla firmware's (lower weight = higher).
  sorting_groups:
    - {id: volture_live, name: "Volture", sorting_weight: -30}
    - {id: volture_settings, name: "Volture settings", sorting_weight: -20}
    - {id: volture_diagnostics, name: "Volture diagnostics", sorting_weight: -10}
  js_include: esp32/web_logo.js  # the Volture logo at the top of the page

debug:
  update_interval: 5s

# Network time, ONLY to timestamp the lines pushed to Grafana. Never used by the control logic.
time:
  - platform: sntp
    id: sntp_time

switch:
  - platform: template
    id: grafana_push
    name: Volture Grafana push
    web_server: {sorting_group_id: volture_settings, sorting_weight: 3}
    icon: mdi:chart-line
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF  # off until switched on; then kept across reboots
    on_turn_off:
      - lambda: volture_device::telemetry() = volture_device::Telemetry();  # free the buffer
  - platform: template
    id: volture_control
    name: Volture control
    web_server: {sorting_group_id: volture_settings, sorting_weight: 1}
    icon: mdi:car-electric
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF  # off until switched on; then kept across reboots

text:
  - platform: template
    id: shelly_url
    name: Volture Shelly EM URL
    web_server: {sorting_group_id: volture_settings, sorting_weight: 2}
    mode: text
    optimistic: true
    restore_value: true
    initial_value: !secret shelly_url

sensor:
  - platform: template
    id: house_power
    name: Volture house power
    web_server: {sorting_group_id: volture_live, sorting_weight: 1}
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: grid_voltage
    name: Volture grid voltage
    web_server: {sorting_group_id: volture_live, sorting_weight: 2}
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: volture_amps
    name: Volture amps
    web_server: {sorting_group_id: volture_live, sorting_weight: 3}
    unit_of_measurement: A
    device_class: current
    accuracy_decimals: 0
    update_interval: never
  - platform: debug
    free:
      name: Volture heap free
      web_server: {sorting_group_id: volture_diagnostics, sorting_weight: 2}
    block:
      name: Volture heap largest block
      web_server: {sorting_group_id: volture_diagnostics, sorting_weight: 3}
    min_free:
      name: Volture heap min free
      web_server: {sorting_group_id: volture_diagnostics, sorting_weight: 4}

text_sensor:
  - platform: template
    id: volture_decision
    name: Volture decision
    web_server: {sorting_group_id: volture_live, sorting_weight: 4}
    update_interval: never
  - platform: template
    id: volture_event
    name: Volture event
    web_server: {sorting_group_id: volture_live, sorting_weight: 5}
    update_interval: never
  - platform: template
    id: grafana_status
    name: Volture Grafana push status
    web_server: {sorting_group_id: volture_diagnostics, sorting_weight: 1}
    update_interval: never

script:
  - id: volture_cycle
    mode: single
    then:
      - lambda: |-
          std::optional<volture::Reading> reading;
          if (!id(shelly_body).empty()) {
            reading = volture_device::parse_shelly(id(shelly_body));
          }
          auto observed = volture_device::observe();
          auto &loop = volture_device::loop();
          auto cycle = loop.step(volture_device::now_s(), reading, observed, id(volture_control).state);
          std::string sent = cycle.dry_run ? "would send: " : "";
          for (const auto &cmd : {cycle.resend, cycle.command}) {
            if (!cmd) {
              continue;
            }
            sent += cmd->charging ? (std::to_string(cmd->amps) + " A ") : std::string("stop ");
            if (cycle.dry_run) {
              continue;
            }
            if (volture_device::send(*cmd)) {
              volture_device::telemetry().last_sent = *cmd;
            } else {
              ESP_LOGW("volture", "car entities not found: command not sent");
            }
          }
          const bool valid = reading && reading->valid;
          id(house_power).publish_state(valid ? reading->power_w : NAN);
          id(grid_voltage).publish_state(valid && reading->voltage_v ? *reading->voltage_v : NAN);
          id(volture_amps).publish_state(loop.ctrl.charging ? loop.ctrl.amps : 0);
          const std::string decision = std::string(loop.ctrl.reason) + (sent == "would send: " ? "" : " · " + sent);
          if (id(volture_decision).state != decision) {
            id(volture_decision).publish_state(decision);
          }
          if (id(volture_event).state != cycle.event) {
            id(volture_event).publish_state(cycle.event);
          }
          // One key=value line per cycle (InfluxDB line protocol fields), for logs and remote storage later.
          ESP_LOGI("volture", "volture power_w=%.0f,valid=%d,car_charging=%d,car_amps=%d,amps=%d,control=%d,reason=\"%s\",event=\"%s\"",
                   reading ? reading->power_w : -1.0, valid, observed ? observed->charging : -1,
                   observed ? observed->amps : -1, loop.ctrl.amps, id(volture_control).state, loop.ctrl.reason, cycle.event);
          auto clock = id(sntp_time).now();
          if (id(grafana_push).state && clock.is_valid() && !std::string("${grafana_url}").empty()) {
            using namespace esphome;
            volture_device::Sample sample;
            sample.reading = reading;
            sample.car = observed;
            sample.car_current_a = volture_device::value_of<sensor::Sensor>(App.get_sensors(), "Charger Current");
            sample.car_power_kw = volture_device::value_of<sensor::Sensor>(App.get_sensors(), "Charger Power");
            sample.amps = loop.ctrl.charging ? loop.ctrl.amps : 0;
            sample.control = id(volture_control).state;
            sample.last_sent = volture_device::telemetry().last_sent;
            sample.attempts = loop.pending ? loop.pending->attempts : 0;
            sample.reason = loop.ctrl.reason;
            sample.event = cycle.event;
            sample.answer = volture_device::text_of("Last Command");
            sample.status = volture_device::text_of("Charging");
            const long long unix_ns = static_cast<long long>(clock.timestamp) * 1000000000LL +
                                      static_cast<long long>(esp_timer_get_time() % 1000000) * 1000LL;
            volture_device::record(sample, volture_device::now_s(), heap_caps_get_free_size(MALLOC_CAP_8BIT),
                                   heap_caps_get_largest_free_block(MALLOC_CAP_8BIT),
                                   volture_device::value_of<sensor::Sensor>(App.get_sensors(), "WiFi Signal"),
                                   volture_device::value_of<sensor::Sensor>(App.get_sensors(), "BLE Signal"), unix_ns);
          }

interval:
  - interval: 5s
    then:
      - http_request.get:
          url: !lambda return id(shelly_url).state + "/emeter/0";
          capture_response: true
          on_response:
            then:
              - lambda: |-
                  id(shelly_body) = response->status_code == 200 ? body : std::string();
              - script.execute: volture_cycle
          on_error:
            then:
              - lambda: id(shelly_body) = std::string();
              - script.execute: volture_cycle
  # Grafana push: the lines buffered since the last push, once a minute, while "Grafana push" is on.
  - interval: 60s
    then:
      - if:
          condition:
            lambda: |-
              return id(grafana_push).state && !std::string("${grafana_url}").empty() &&
                     !volture_device::telemetry().buffer.empty();
          then:
            - lambda: |-
                id(grafana_body).swap(volture_device::telemetry().buffer);  // what is not sent now is lost
                volture_device::telemetry().buffer.clear();
            - http_request.post:
                url: !lambda return std::string("${grafana_url}");
                request_headers:
                  Content-Type: text/plain
                  Authorization: !lambda return volture_device::basic_auth("${grafana_user}", "${grafana_token}");
                body: !lambda return id(grafana_body);
                on_response:
                  then:
                    - lambda: |-
                        const bool ok = response->status_code >= 200 && response->status_code < 300;
                        id(grafana_status).publish_state((ok ? "ok " : "error ") + std::to_string(response->status_code) +
                                                         ", " + std::to_string(id(grafana_body).size()) + " B");
                        ESP_LOGI("volture", "grafana push: status=%d bytes=%u heap_free=%u heap_block=%u",
                                 response->status_code, (unsigned) id(grafana_body).size(),
                                 heap_caps_get_free_size(MALLOC_CAP_8BIT), heap_caps_get_largest_free_block(MALLOC_CAP_8BIT));
                        id(grafana_body).clear();
                on_error:
                  then:
                    - lambda: |-
                        id(grafana_status).publish_state("error: no answer");
                        ESP_LOGW("volture", "grafana push failed: heap_free=%u", heap_caps_get_free_size(MALLOC_CAP_8BIT));
                        id(grafana_body).clear();

