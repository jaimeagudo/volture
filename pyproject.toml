[project]
name = "volture"
version = "0.2.0"
description = "Tesla Model 3 charge limiter driven by a Shelly EM on the main feed"
requires-python = ">=3.12,<3.15"  # esphome 2026.9.1 range
dependencies = ["aiohttp>=3.9", "aioesphomeapi>=24", "pyyaml>=6"]

[dependency-groups]
# esphome builds/flashes esp32.yaml; pinned to the minimum the firmware release in esp32.yaml requires.
dev = ["pytest>=8", "esphome==2026.9.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
