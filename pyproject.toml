[project]
name = "volture"
version = "0.2.0"
description = "Tesla Model 3 charge limiter driven by a Shelly EM on the main feed"
requires-python = ">=3.12,<3.15"  # esphome 2026.10.2 range
dependencies = ["aiohttp>=3.9", "aioesphomeapi>=24", "pyyaml>=6"]

[dependency-groups]
# esphome builds/flashes esp32.yaml. The firmware release in esp32.yaml pins 2026.9.1; 2026.10.x is used for its
# web server fix (esphome#17800: an unread page's session no longer leaves a dangling pointer behind), checked
# on the car 2026-11-04.
dev = ["pytest>=8", "esphome==2026.10.2", "pre-commit>=4"]

[tool.pytest.ini_options]
pythonpath = ["."]
