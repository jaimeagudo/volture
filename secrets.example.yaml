# Copy to secrets.yaml (gitignored). Shared by the ESP32 firmware (esp32.yaml) and volture.
# Key names are referenced by esp32.yaml and volture/ (secrets.py readers): do not rename them.
wifi_ssid: "" # 2.4 GHz network (the ESP32 cannot join 5 GHz)
wifi_password: ""
wifi2_ssid: "" # second 2.4 GHz network (e.g. garage); the ESP32 joins whichever is in range
wifi2_password: ""
wifi_hotspot_password: "" # >= 8 chars; Wi-Fi the ESP32 opens if it cannot join yours
api_encryption_key: "" # 32 random bytes, base64: python3 -c "import os,base64;print(base64.b64encode(os.urandom(32)).decode())"
tesla_vin: "" # 17 characters
ble_mac_address: "" # car Bluetooth MAC, AA:BB:CC:DD:EE:FF (digits 0-9 and A-F only). NOT the "S...C" name
scheduled_reboot_hour: 14 # local hour (0-23) the ESP32 reboots daily, only if the car is unplugged; -1 = never
shelly_url: "http://SHELLY_IP" # the real Shelly EM; to use the simulator's fake one, run volture.main --sim-shelly
web_user: "" # ESP32 web page http://volture.local: login user
web_password: "" # ...and its password
# Grafana Cloud push (optional, README: Grafana). Leave grafana_url empty to never send anything.
grafana_url: "" # https://<influx host>/api/v1/push/influx/write
grafana_user: "" # the stack's InfluxDB/Prometheus instance ID (a number)
grafana_token: "" # access policy token with the metrics:write scope

# Every setting of volture's algorithm and loop. Leave a line out to keep its default.
volture:
  esphome_host: volture.local # ESP32 address on your network
  contracted_power_w: 4600 # utility limit; never exceeded (20 A at 230 V)
  headroom_w: 230 # stay this far below it (working ceiling = 4370 W)
  fallback_voltage_v: 230 # used when the Shelly reports no plausible voltage (180-260 V)
  min_amps: 5 # lowest current the car accepts
  max_amps: 32 # charger / car maximum
  ramp_up_step_amps: 1 # amps added per step when there is room
  ramp_up_every_s: 15 # minimum seconds between ramp-up steps
  resume_after_s: 60 # after Volture stopped a charge, power must stay low this long before it restarts it
  stop_after_invalid_s: 30 # no trustworthy Shelly reading for this long -> stop
  poll_s: 5 # seconds between Shelly readings
  car_command_timeout_s: 10 # a car command never blocks the loop longer than this
  confirm_timeout_s: 15 # wait this long for the car to report the commanded state
  confirm_max_attempts: 3 # sends per command before trusting the car's reported state
